<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="300" viewBox="0 0 1010 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1010" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F7F4"/>
      <stop offset="0.62" stop-color="#EEF2F5"/>
      <stop offset="1" stop-color="#E4EBF0"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111C2A"/>
      <stop offset="1" stop-color="#1B3045"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4C8CC5"/>
      <stop offset="1" stop-color="#28649B"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1010" height="300" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1010" height="300" fill="url(#bg)"/>

    <!-- subtle grid -->
    <g stroke="#AAB8C3" stroke-width="1" opacity=".24">
      <path d="M0 60H1010M0 120H1010M0 180H1010M0 240H1010"/>
      <path d="M70 0V300M170 0V300M270 0V300M370 0V300M470 0V300
               M570 0V300M670 0V300M770 0V300M870 0V300M970 0V300"/>
    </g>

    <!-- LEFT EDITORIAL CONTENT -->
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="56" y="52" fill="#557087" font-size="9" font-weight="700" letter-spacing="2.8">
        SOFTWARE ENGINEER
      </text>

      <text x="56" y="91" fill="#132233" font-size="31" font-weight="700">
        Building digital
      </text>
      <text x="56" y="127" fill="#132233" font-size="31" font-weight="700">
        products that work.
      </text>

      <text x="58" y="153" fill="#657789" font-size="11.5">
        Full-Stack · AI/ML · APIs · Cloud
      </text>

      <!-- code/editor card -->
      <rect x="56" y="174" width="360" height="70" rx="7" fill="#101C2A"/>
      <circle cx="72" cy="187" r="3" fill="#D36F48"/>
      <circle cx="83" cy="187" r="3" fill="#C9A35E"/>
      <circle cx="94" cy="187" r="3" fill="#6D9F7C"/>

      <g font-family="monospace" font-size="9.5">
        <text x="70" y="208" fill="#7391AA">const</text>
        <text x="105" y="208" fill="#DCE6EC">product</text>
        <text x="151" y="208" fill="#71899D">=</text>
        <text x="161" y="208" fill="#6FA9D4">build</text>
        <text x="198" y="208" fill="#D6A96A">({</text>
        <text x="215" y="208" fill="#AFC6D6">web, api, ai</text>
        <text x="282" y="208" fill="#D6A96A">})</text>

        <text x="70" y="226" fill="#5F788E">// design  →  develop  →  deploy</text>
      </g>

      <!-- compact technology labels -->
      <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="7.5">
        <rect x="56" y="256" width="47" height="22" rx="4" fill="#3776AB"/>
        <text x="79.5" y="270.5" text-anchor="middle" fill="white">PYTHON</text>

        <rect x="109" y="256" width="47" height="22" rx="4" fill="#273444"/>
        <text x="132.5" y="270.5" text-anchor="middle" fill="white">JAVA</text>

        <rect x="162" y="256" width="47" height="22" rx="4" fill="#397A63"/>
        <text x="185.5" y="270.5" text-anchor="middle" fill="white">REACT</text>

        <rect x="215" y="256" width="47" height="22" rx="4" fill="#4E7190"/>
        <text x="238.5" y="270.5" text-anchor="middle" fill="white">NODE</text>

        <rect x="268" y="256" width="47" height="22" rx="4" fill="#6A5B9A"/>
        <text x="291.5" y="270.5" text-anchor="middle" fill="white">AI / ML</text>

        <rect x="321" y="256" width="47" height="22" rx="4" fill="#5A7C68"/>
        <text x="344.5" y="270.5" text-anchor="middle" fill="white">CLOUD</text>
      </g>
    </g>

    <!-- RIGHT ABSTRACT SOFTWARE SYSTEM -->
    <g transform="translate(505 0)">
      <!-- large architectural panel -->
      <rect x="18" y="30" width="445" height="235" rx="13"
            fill="#F8F9F7" stroke="#C7D2DB" stroke-width="1.2"/>

      <!-- header -->
      <g font-family="monospace">
        <text x="42" y="54" fill="#657A8C" font-size="8" letter-spacing="1.6">
          SYSTEM / ARCHITECTURE
        </text>
        <circle cx="407" cy="51" r="4" fill="#5C9673"/>
        <text x="418" y="54" fill="#718291" font-size="7">ONLINE</text>
      </g>

      <!-- frontend block -->
      <g font-family="Arial, Helvetica, sans-serif">
        <rect x="43" y="77" width="105" height="57" rx="7" fill="#17283A"/>
        <text x="57" y="96" fill="#7EB0D8" font-size="8" font-weight="700">FRONTEND</text>
        <text x="57" y="113" fill="#EDF3F6" font-size="10">React / Web</text>
        <text x="57" y="125" fill="#91A7B8" font-size="7.5">interface + state</text>

        <!-- API -->
        <rect x="181" y="77" width="105" height="57" rx="7" fill="#E9EFF3" stroke="#9EB2C1"/>
        <text x="195" y="96" fill="#3978AA" font-size="8" font-weight="700">API LAYER</text>
        <text x="195" y="113" fill="#263B4D" font-size="10">REST / Services</text>
        <text x="195" y="125" fill="#708392" font-size="7.5">logic + auth</text>

        <!-- AI -->
        <rect x="319" y="77" width="105" height="57" rx="7" fill="#F1EDEF" stroke="#C9AEB7"/>
        <text x="333" y="96" fill="#76516B" font-size="8" font-weight="700">AI / ML</text>
        <text x="333" y="113" fill="#3C3040" font-size="10">Models</text>
        <text x="333" y="125" fill="#7C6876" font-size="7.5">inference + data</text>

        <!-- connections -->
        <g stroke="#7891A5" stroke-width="1.2" fill="none">
          <path d="M148 105H181"/>
          <path d="M286 105H319"/>
          <path d="M234 134V163"/>
          <path d="M372 134V163"/>
          <path d="M234 163H372"/>
        </g>
        <g fill="#5D83A1">
          <circle cx="164" cy="105" r="2.5"/>
          <circle cx="303" cy="105" r="2.5"/>
          <circle cx="234" cy="163" r="2.5"/>
          <circle cx="372" cy="163" r="2.5"/>
        </g>

        <!-- data / deployment -->
        <rect x="139" y="177" width="190" height="56" rx="7" fill="#122536"/>
        <text x="157" y="195" fill="#6CA2C8" font-size="8" font-weight="700">DATA + DEPLOYMENT</text>
        <text x="157" y="213" fill="#F1F5F7" font-size="10">Database  ·  Cloud</text>
        <text x="157" y="225" fill="#8299AA" font-size="7.5">store · scale · ship</text>
      </g>

      <!-- decorative side index -->
      <g font-family="monospace" fill="#7A8B99" font-size="7.5">
        <text x="43" y="249">01</text>
        <text x="91" y="249">CLIENT</text>
        <text x="177" y="249">02</text>
        <text x="225" y="249">SERVICE</text>
        <text x="319" y="249">03</text>
        <text x="367" y="249">MODEL</text>
      </g>
    </g>

    <!-- small orange design accent -->
    <path d="M475 39V84" stroke="#D4774B" stroke-width="3"/>
    <path d="M475 216V260" stroke="#D4774B" stroke-width="3"/>

    <!-- outer border -->
    <rect x=".75" y=".75" width="1008.5" height="298.5" rx="21.25"
          fill="none" stroke="#C5D0D8" stroke-width="1.5"/>
  </g>
</svg>